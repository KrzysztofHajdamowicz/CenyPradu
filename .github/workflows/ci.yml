name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-python:
    name: Lint Python
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Ruff check (linting)
        run: uv run ruff check scripts/

      - name: Ruff format (formatting)
        run: uv run ruff format --check scripts/

  test-scraper:
    name: Test scraper
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Verify scraper loads
        run: uv run python scripts/scrape_tge.py --help

      - name: Verify existing data
        run: |
          LATEST_DATE=$(uv run python -c "
          import json
          idx = json.load(open('data/prices/index.json'))
          print(idx['dates'][-1])
          ")
          echo "Weryfikacja danych dla: ${LATEST_DATE}"
          uv run python scripts/scrape_tge.py --verify "${LATEST_DATE}"

  validate-tariffs:
    name: Validate tariff schemas
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Validate tariff JSON files against schema
        run: |
          uv run check-jsonschema \
            --schemafile data/tariffs/schema.json \
            data/tariffs/tauron-*.json \
            data/tariffs/energa-*.json \
            data/tariffs/enea-*.json \
            data/tariffs/pge-*.json \
            data/tariffs/stoen-*.json

  lint-actions:
    name: Lint GitHub Actions
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install actionlint
        run: |
          curl -sSLf https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash | bash -s -- latest /usr/local/bin

      - name: Run actionlint
        run: actionlint
