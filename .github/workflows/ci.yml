name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-python:
    name: Lint Python
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "latest-known"
          enable-cache: auto

      - name: Install dependencies
        run: uv sync --frozen

      - name: Ruff check (linting)
        run: uv run ruff check scripts/

      - name: Ruff format (formatting)
        run: uv run ruff format --check scripts/

  test-scraper:
    name: Test scraper
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "latest-known"
          enable-cache: auto

      - name: Install dependencies
        run: uv sync --frozen

      - name: Verify scraper loads
        run: uv run python scripts/scrape_tge.py --help

      - name: Verify existing data
        run: |
          LATEST_DATE=$(uv run python -c "
          import json
          idx = json.load(open('data/prices/index.json'))
          print(idx['dates'][-1])
          ")
          echo "Weryfikacja danych dla: ${LATEST_DATE}"
          uv run python scripts/scrape_tge.py --verify "${LATEST_DATE}"

  validate-tariffs:
    name: Validate tariff schemas
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "latest-known"
          enable-cache: auto

      - name: Install dependencies
        run: uv sync --frozen

      - name: Validate tariff JSON files against schema
        run: |
          uv run check-jsonschema \
            --schemafile data/tariffs/schema.json \
            data/tariffs/tauron-*.json \
            data/tariffs/energa-*.json \
            data/tariffs/enea-*.json \
            data/tariffs/pge-*.json \
            data/tariffs/stoen-*.json

  lint-actions:
    name: Lint GitHub Actions
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install actionlint
        run: |
          set -o pipefail
          curl -sSLf --retry 5 --retry-all-errors \
            https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash \
            | bash -s -- latest /usr/local/bin

      - name: Run actionlint
        run: actionlint

  # Automatyczny merge PRów Dependabota z aktualizacjami minor/patch.
  # Uruchamia się dopiero, gdy wszystkie powyższe joby CI przejdą.
  # Aktualizacje major (oraz PRy od innych autorów) są pomijane.
  dependabot-automerge:
    name: Auto-merge Dependabot (minor/patch)
    needs: [lint-python, test-scraper, validate-tariffs, lint-actions]
    if: >-
      github.event_name == 'pull_request'
      && github.actor == 'dependabot[bot]'
      && github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge PR
        if: >-
          steps.metadata.outputs.update-type == 'version-update:semver-minor'
          || steps.metadata.outputs.update-type == 'version-update:semver-patch'
        run: gh pr merge --merge "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
