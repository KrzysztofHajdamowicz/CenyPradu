name: Scrape TGE Prices

on:
  schedule:
    # 10:00 UTC = 11:00 CET (zima) = 12:00 CEST (lato)
    # TGE publikuje Fixing I codziennie o 10:30 czasu polskiego
    - cron: '0 10 * * *'

  workflow_dispatch:
    inputs:
      delivery_date:
        description: >
          Data dostawy YYYY-MM-DD (domyślnie: jutro).
          Przydatne do backfillingu brakujących dni.
        required: false
        type: string

permissions:
  contents: write   # Wymagane do git commit + push

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Set up uv
        uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          version: "latest-known"
          enable-cache: auto

      - name: Install dependencies
        run: uv sync --frozen

      - name: Scrape TGE prices
        run: uv run python scripts/scrape_tge.py
        env:
          PYTHONUNBUFFERED: "1"
          # Pusta wartość = jutro; wypełniona przez workflow_dispatch = konkretna data
          DELIVERY_DATE: ${{ inputs.delivery_date }}

      - name: Commit and push new data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add data/prices/

          if git diff --staged --quiet; then
            echo "Brak nowych danych do zacommitowania (plik już istnieje lub nic nie zmieniono)."
          else
            # Wyznacz datę dostawy z pliku index.json
            DELIVERY_DATE=$(python -c "
          import json, os
          idx = json.load(open('data/prices/index.json'))
          print(idx.get('latest', 'unknown'))
          ")
            git commit -m "data: ceny TGE Fixing I dla ${DELIVERY_DATE}"
            git push
            echo "Dane opublikowane dla: ${DELIVERY_DATE}"
          fi

      - name: Upload debug screenshot on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: debug-screenshot-${{ github.run_id }}
          path: debug_screenshot.png
          if-no-files-found: ignore
          retention-days: 7
